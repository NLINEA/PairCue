[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "subflow-plex"
version = "0.1.0b2"
description = "Cross-platform aligned bilingual subtitles for language learning"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Zackary" }]
keywords = [
  "plex",
  "jellyfin",
  "emby",
  "subtitles",
  "bilingual",
  "language-learning",
  "translation",
  "nas",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "fastapi>=0.128,<1",
  "httpx>=0.28,<1",
  "opencc-python-reimplemented>=0.1.7,<1",
  "pydantic-settings>=2.12,<3",
  "python-multipart>=0.0.20,<1",
  "srt>=3.5.3,<4",
  "subliminal>=2.6,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
sync = ["ffsubsync>=0.4.29,<1"]
dev = [
  "build>=1.3,<2",
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
subflow = "subflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/subflow"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"src/subflow/downloads_api.py" = ["E501"]
"tests/*" = ["S104", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["subflow"]

[[tool.mypy.overrides]]
module = ["babelfish", "opencc", "srt", "subliminal", "subliminal.*"]
ignore_missing_imports = true
