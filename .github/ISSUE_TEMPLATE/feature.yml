name: Feature request
description: Propose a focused improvement to private-library bilingual subtitle learning.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the learning or media-library job, not only the desired implementation.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: How do you solve it today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would a successful outcome look like?
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Project fit
      options:
        - label: This keeps PairCue focused on reusable bilingual subtitles for private media.
          required: true
